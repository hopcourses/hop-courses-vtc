<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation Hop Courses</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background-color: #f4f7f6; margin: 0; }
        .app-container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        
        .tabs { display: flex; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; }
        .tab { flex: 1; padding: 12px; border: none; background: #eee; cursor: pointer; font-weight: bold; color: #555; }
        .tab.active { background: #f39c12; color: white; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #666; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }

        button.submit { width: 100%; padding: 15px; background: #f39c12; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        button.submit:hover { background: #e67e22; }
        button.pay { background: #27ae60; margin-top: 10px; display: none; }
        button.pay:hover { background: #219653; }
        
        #resultat { margin-top: 20px; padding: 15px; background: #fff3e0; border-radius: 10px; display: none; text-align: center; }
        .loader { display: none; text-align: center; margin-top: 10px; font-style: italic; color: #666; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>Où allez-vous ?</h2>

    <div class="tabs">
        <button class="tab active" id="btn-simple" onclick="setMode('simple')">Trajet Simple</button>
        <button class="tab" id="btn-mise" onclick="setMode('mise')">Mise à dispo</button>
    </div>

    <div class="form-group">
        <label>Gamme de véhicule</label>
        <select id="gamme">
            <option value="confort">Confort (Max 4 passagers)</option>
            <option value="famille">Famille (Max 6 passagers)</option>
        </select>
    </div>

    <div class="form-group" id="field-depart">
        <label>Adresse de départ</label>
        <input type="text" id="depart" placeholder="Tapez une adresse..." list="depart-suggestions" oninput="ralentirAutocompletion('depart', 'depart-suggestions')">
        <datalist id="depart-suggestions"></datalist>
    </div>

    <div class="form-group" id="field-arrivee">
        <label>Adresse d'arrivée</label>
        <input type="text" id="arrivee" placeholder="Tapez une adresse..." list="arrivee-suggestions" oninput="ralentirAutocompletion('arrivee', 'arrivee-suggestions')">
        <datalist id="arrivee-suggestions"></datalist>
    </div>

    <div class="form-group" id="field-duree" style="display:none;">
        <label>Durée de mise à disposition</label>
        <select id="duree">
            <option value="1">1 Heure</option>
            <option value="2">2 Heures</option>
            <option value="3">3 Heures</option>
            <option value="4">4 Heures</option>
            <option value="5">5 Heures</option>
            <option value="6">6 Heures</option>
            <option value="7">7 Heures</option>
            <option value="8">8 Heures</option>
            <option value="9">9 Heures</option>
            <option value="10">10 Heures</option>
            <option value="11">11 Heures</option>
            <option value="12">12 Heures</option>
        </select>
    </div>

    <div class="row">
        <div class="form-group">
            <label>Date</label>
            <input type="date" id="date">
        </div>
        <div class="form-group">
            <label>Heure</label>
            <input type="time" id="heure">
        </div>
    </div>

    <div class="row">
        <div class="form-group">
            <label>Passagers</label>
            <input type="number" id="passagers" value="1" min="1" max="6">
        </div>
        <div class="form-group">
            <label>Bagages</label>
            <input type="number" id="bagages" value="0" min="0">
        </div>
    </div>

    <button class="submit" onclick="calculer()">Voir les estimations</button>
    <div class="loader" id="loader">Calcul de l'itinéraire en cours...</div>

    <div id="resultat">
        <p style="margin: 0; font-size: 18px;">Prix estimé : <strong id="prixTotal" style="font-size: 24px; color: #d35400;">-</strong> €</p>
        <button class="submit pay" id="btn-payer" onclick="payer()">Confirmer et Payer</button>
    </div>
</div>

<script>
    const ADRESSE_BASE = "Place de la Gare, 27100 Bailleul";
    let mode = 'simple';
    let timeoutId = null;
    let montantFinal = 0;

    const tarifsMiseADispo = {
        'confort': { 1:90, 2:180, 3:255, 4:340, 5:425, 6:480, 7:560, 8:600, 9:675, 10:700, 11:770, 12:960 },
        'famille': { 1:180, 2:360, 3:510, 4:680, 5:850, 6:960, 7:1120, 8:1200, 9:1300, 10:1400, 11:1500, 12:1900 }
    };

    function setMode(m) {
        mode = m;
        document.getElementById('btn-simple').className = (m === 'simple') ? 'tab active' : 'tab';
        document.getElementById('btn-mise').className = (m === 'mise') ? 'tab active' : 'tab';
        
        document.getElementById('field-arrivee').style.display = (m === 'simple') ? 'block' : 'none';
        document.getElementById('field-duree').style.display = (m === 'mise') ? 'block' : 'none';
        document.getElementById('resultat').style.display = 'none';
    }

    function ralentirAutocompletion(inputId, listId) {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => autocompleter(inputId, listId), 300);
    }

    async function autocompleter(inputId, listId) {
        const query = document.getElementById(inputId).value;
        if (query.length < 3) return;
        try {
            const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=15&lang=fr`);
            const data = await res.json();
            const datalist = document.getElementById(listId);
            datalist.innerHTML = '';
            let count = 0;
            data.features.forEach(item => {
                if (count >= 5) return;
                const props = item.properties || {};
                if (props.countrycode !== 'FR' && props.countrycode !== 'BE') return;
                const numero = props.housenumber ? props.housenumber + ' ' : '';
                const rue = props.street || props.name || '';
                const cp = props.postcode || '';
                const ville = props.city || props.town || props.village || '';
                if (rue && cp && ville) {
                    const cleanAddress = `${numero}${rue}, ${cp} ${ville}`.trim();
                    if (![...datalist.options].some(opt => opt.value === cleanAddress)) {
                        const option = document.createElement('option');
                        option.value = cleanAddress;
                        datalist.appendChild(option);
                        count++;
                    }
                }
            });
        } catch (error) { console.error(error); }
    }

    // NOUVELLE FONCTION (utilise Photon à la place de Nominatim pour éviter le blocage)
    async function getCoordinates(adresse) {
        try {
            const reponse = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(adresse)}&limit=1`);
            const data = await reponse.json();
            if (data.features && data.features.length > 0) {
                return { 
                    lon: data.features[0].geometry.coordinates[0], 
                    lat: data.features[0].geometry.coordinates[1] 
                };
            }
            throw new Error("Adresse introuvable : " + adresse);
        } catch (error) {
            throw new Error("Impossible de se connecter pour localiser l'adresse.");
        }
    }

    async function calculer() {
        const gamme = document.getElementById('gamme').value;
        const resultatDiv = document.getElementById('resultat');
        const loader = document.getElementById('loader');
        const btnPayer = document.getElementById('btn-payer');

        resultatDiv.style.display = 'none';

        if (mode === 'mise') {
            const duree = parseInt(document.getElementById('duree').value);
            montantFinal = tarifsMiseADispo[gamme][duree];
            document.getElementById('prixTotal').innerText = montantFinal;
            resultatDiv.style.display = 'block';
            btnPayer.style.display = 'block';
            return;
        }

        const departTxt = document.getElementById('depart').value;
        const arriveeTxt = document.getElementById('arrivee').value;
        if (!departTxt || !arriveeTxt) return alert("Veuillez remplir les adresses.");

        loader.style.display = 'block';
        
        try {
            const coordsBase = await getCoordinates(ADRESSE_BASE);
            const coordsDepart = await getCoordinates(departTxt);
            const coordsArrivee = await getCoordinates(arriveeTxt);

            const urlOSRM = `https://router.project-osrm.org/route/v1/driving/${coordsBase.lon},${coordsBase.lat};${coordsDepart.lon},${coordsDepart.lat};${coordsArrivee.lon},${coordsArrivee.lat};${coordsBase.lon},${coordsBase.lat}?overview=false`;
            
            const reponseRoute = await fetch(urlOSRM);
            if (!reponseRoute.ok) throw new Error("Le serveur de calcul de distance est surchargé. Réessayez.");
            
            const dataRoute = await reponseRoute.json();
            if (dataRoute.code !== 'Ok') throw new Error("Erreur de calcul d'itinéraire.");

            const legs = dataRoute.routes[0].legs;
            const distApproche = legs[0].distance / 1000;
            const distTrajet = legs[1].distance / 1000;
            const distRetour = legs[2].distance / 1000;

            let priseEnCharge = (gamme === 'confort') ? 5 : 10;
            let tarifApproche = (gamme === 'confort') ? 0.45 : 0.60;
            let tarifTrajet   = (gamme === 'confort') ? 0.98 : 1.00;
            let tarifRetour   = (gamme === 'confort') ? 0.45 : 0.60;

            montantFinal = priseEnCharge + (distApproche * tarifApproche) + (distTrajet * tarifTrajet) + (distRetour * tarifRetour);

            document.getElementById('prixTotal').innerText = montantFinal.toFixed(2);
            loader.style.display = 'none';
            resultatDiv.style.display = 'block';
            btnPayer.style.display = 'block';

        } catch (error) {
            loader.style.display = 'none';
            // Capture de l'erreur "Failed to fetch" pour expliquer la cause au client (souvent un bloqueur de pub)
            if (error.message.includes("Failed to fetch") || error.message.includes("NetworkError")) {
                alert("Le calcul a été bloqué par votre navigateur. Essayez de désactiver votre bloqueur de publicité (Adblock) ou vérifiez votre connexion.");
            } else {
                alert(error.message);
            }
        }
    }

    function payer() {
        alert("Redirection vers Stripe pour un montant de " + montantFinal.toFixed(2) + " €");
    }
</script>

</body>
</html>
