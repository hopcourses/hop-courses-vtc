<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation Hop Courses VTC</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background-color: #f4f7f6; margin: 0; }
        .app-container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        h3 { color: #1a2b4c; margin-bottom: 15px; }
        
        .tabs { display: flex; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; }
        .tab { flex: 1; padding: 12px; border: none; background: #eee; cursor: pointer; font-weight: bold; color: #555; }
        .tab.active { background: #f39c12; color: white; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: #555; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; }
        label span { color: #e74c3c; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; font-family: inherit; }
        textarea { resize: vertical; min-height: 80px; }
        
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }

        button.submit { width: 100%; padding: 15px; background: #f39c12; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; margin-top: 20px; cursor: pointer; transition: 0.3s; }
        button.submit:hover { background: #e67e22; }
        
        .loader { display: none; text-align: center; margin-top: 10px; font-style: italic; color: #666; font-size: 14px; }
        
        #step-2 { display: none; }
        .btn-retour { cursor: pointer; color: #666; font-size: 14px; margin-bottom: 15px; display: inline-block; }
        .btn-retour:hover { color: #333; }
        
        .recap-box { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 12px; padding: 20px; margin-top: 25px; }
        .recap-box h4 { margin: 0 0 15px 0; color: #1a2b4c; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        .recap-line { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: #555; }
        .recap-line strong { color: #333; }
        
        .promo-box { display: flex; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ddd; }
        .promo-box input { padding: 10px; font-size: 14px; flex: 1; }
        .promo-box button { background: #000; color: white; border: none; border-radius: 8px; padding: 0 15px; font-weight: bold; cursor: pointer; }
        
        .total-box { text-align: right; margin-top: 20px; }
        .total-box .titre { font-size: 16px; font-weight: bold; color: #333; }
        .total-box .prix { font-size: 24px; font-weight: bold; color: #1a2b4c; }
        .total-box .tva { font-size: 11px; color: #888; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- ================= ÉTAPE 1 : RÉSERVATION ================= -->
    <div id="step-1">
        <h2>Où allez-vous ?</h2>

        <div class="tabs">
            <button class="tab active" id="btn-simple" onclick="setMode('simple')">Trajet Simple</button>
            <button class="tab" id="btn-mise" onclick="setMode('mise')">Mise à dispo</button>
        </div>

        <div class="form-group">
            <label>Gamme de véhicule</label>
            <select id="gamme">
                <option value="confort">Confort (Max 4 passagers)</option>
                <option value="famille">Famille (Max 6 passagers)</option>
            </select>
        </div>

        <div class="form-group" id="field-depart">
            <label>Adresse de départ</label>
            <input type="text" id="depart" placeholder="Tapez une adresse..." list="depart-suggestions" oninput="ralentirAutocompletion('depart', 'depart-suggestions')">
            <datalist id="depart-suggestions"></datalist>
        </div>

        <div class="form-group" id="field-arrivee">
            <label>Adresse d'arrivée</label>
            <input type="text" id="arrivee" placeholder="Tapez une adresse..." list="arrivee-suggestions" oninput="ralentirAutocompletion('arrivee', 'arrivee-suggestions')">
            <datalist id="arrivee-suggestions"></datalist>
        </div>

        <div class="form-group" id="field-duree" style="display:none;">
            <label>Durée de mise à disposition</label>
            <select id="duree">
                <option value="1">1 Heure</option>
                <option value="2">2 Heures</option>
                <option value="3">3 Heures</option>
                <option value="4">4 Heures</option>
                <option value="5">5 Heures</option>
                <option value="6">6 Heures</option>
                <option value="7">7 Heures</option>
                <option value="8">8 Heures</option>
                <option value="9">9 Heures</option>
                <option value="10">10 Heures</option>
                <option value="11">11 Heures</option>
                <option value="12">12 Heures</option>
            </select>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Date</label>
                <!-- ATTENTION : min="" est mis à jour dynamiquement au chargement -->
                <input type="date" id="date">
            </div>
            <div class="form-group">
                <label>Heure</label>
                <input type="time" id="heure">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Passagers</label>
                <input type="number" id="passagers" value="1" min="1" max="6">
            </div>
            <div class="form-group">
                <label>Bagages</label>
                <input type="number" id="bagages" value="0" min="0">
            </div>
        </div>

        <button class="submit" onclick="reserver()">Réserver</button>
        <div class="loader" id="loader">Vérification et calcul en cours...</div>
    </div>


    <!-- ================= ÉTAPE 2 : COORDONNÉES ET RÉCAP ================= -->
    <div id="step-2">
        <div class="btn-retour" onclick="retourStep1()">← Retour</div>
        <h3>Vos coordonnées</h3>

        <div class="form-group">
            <label>Nom Complet <span>*</span></label>
            <input type="text" id="client_nom" placeholder="Jean Dupont">
        </div>

        <div class="form-group">
            <label>Email <span>*</span></label>
            <input type="email" id="client_email" placeholder="jean.dupont@email.com">
        </div>

        <div class="form-group">
            <label>Téléphone <span>*</span></label>
            <input type="tel" id="client_tel" placeholder="06 12 34 56 78">
        </div>

        <div class="form-group">
            <label>Informations Complémentaires</label>
            <textarea id="client_infos" placeholder="Numéro de vol, code train, siège bébé..."></textarea>
        </div>

        <div class="form-group">
            <label>N° et Rue <span>*</span></label>
            <input type="text" id="client_rue" placeholder="ex: 123 Avenue des Champs-Élysées">
        </div>

        <div class="row">
            <div class="form-group">
                <label>Code Postal <span>*</span></label>
                <input type="text" id="client_cp" placeholder="75008">
            </div>
            <div class="form-group">
                <label>Ville <span>*</span></label>
                <input type="text" id="client_ville" placeholder="Paris">
            </div>
        </div>

        <div class="form-group">
            <label>Pays <span>*</span></label>
            <input type="text" id="client_pays" value="France">
        </div>

        <!-- Boîte de Récapitulatif -->
        <div class="recap-box">
            <h4>Récapitulatif</h4>
            <div class="recap-line">
                <span>Véhicule</span>
                <strong id="recap-vehicule">-</strong>
            </div>
            <div class="recap-line">
                <span>Date & Heure</span>
                <strong id="recap-datetime">-</strong>
            </div>
            <div class="recap-line">
                <span>Trajet</span>
                <strong id="recap-trajet">-</strong>
            </div>

            <div class="promo-box">
                <input type="text" placeholder="CODE PROMO">
                <button type="button">Appliquer</button>
            </div>

            <div class="total-box">
                <div class="titre">Total</div>
                <div class="prix"><span id="recap-prix">0.00</span> €</div>
                <div class="tva">Dont TVA (0%): 0.00 €</div>
            </div>
        </div>

        <button class="submit" onclick="procederPaiement()">Procéder au paiement</button>
    </div>

</div>

<script>
    const ADRESSE_BASE = "198, Résidence des bleuets 59299 Boeschepe";
    let mode = 'simple';
    let timeoutId = null;
    let montantFinal = 0;
    let distanceFinaleKm = 0;

    const tarifsMiseADispo = {
        'confort': { 1:90, 2:180, 3:255, 4:340, 5:425, 6:480, 7:560, 8:600, 9:675, 10:700, 11:770, 12:960 },
        'famille': { 1:180, 2:360, 3:510, 4:680, 5:850, 6:960, 7:1120, 8:1200, 9:1300, 10:1400, 11:1500, 12:1900 }
    };

    // Injection automatique et stricte de la date minimale du jour au chargement
    document.addEventListener("DOMContentLoaded", function() {
        const dateActuelle = new Date();
        const annee = dateActuelle.getFullYear();
        const mois = String(dateActuelle.getMonth() + 1).padStart(2, '0');
        const jour = String(dateActuelle.getDate()).padStart(2, '0');
        
        const dateLocal = `${annee}-${mois}-${jour}`;
        const inputDate = document.getElementById("date");
        inputDate.setAttribute("min", dateLocal);
        inputDate.value = dateLocal; // Pré-remplit par défaut sur aujourd'hui pour plus de confort
    });

    function setMode(m) {
        mode = m;
        document.getElementById('btn-simple').className = (m === 'simple') ? 'tab active' : 'tab';
        document.getElementById('btn-mise').className = (m === 'mise') ? 'tab active' : 'tab';
        document.getElementById('field-arrivee').style.display = (m === 'simple') ? 'block' : 'none';
        document.getElementById('field-duree').style.display = (m === 'mise') ? 'block' : 'none';
    }

    function ralentirAutocompletion(inputId, listId) {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => autocompleter(inputId, listId), 300);
    }

    async function autocompleter(inputId, listId) {
        const query = document.getElementById(inputId).value;
        if (query.length < 3) return;
        try {
            const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=15&lang=fr`);
            const data = await res.json();
            const datalist = document.getElementById(listId);
            datalist.innerHTML = '';
            let count = 0;
            data.features.forEach(item => {
                if (count >= 5) return;
                const props = item.properties || {};
                if (props.countrycode !== 'FR' && props.countrycode !== 'BE') return;
                
                const numero = props.housenumber ? props.housenumber + ' ' : '';
                const rue = props.street || props.name || '';
                const cp = props.postcode || '';
                const ville = props.city || props.town || props.village || '';
                
                if (rue && cp && ville) {
                    const cleanAddress = `${numero}${rue}, ${cp} ${ville}`.trim();
                    if (![...datalist.options].some(opt => opt.value === cleanAddress)) {
                        const option = document.createElement('option');
                        option.value = cleanAddress;
                        datalist.appendChild(option);
                        count++;
                    }
                }
            });
        } catch (error) { console.error(error); }
    }

    async function getCoordinates(adresse) {
        try {
            const reponse = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(adresse)}&limit=1`);
            const data = await reponse.json();
            if (data.features && data.features.length > 0) {
                return { 
                    lon: data.features[0].geometry.coordinates[0], 
                    lat: data.features[0].geometry.coordinates[1] 
                };
            }
            throw new Error("Adresse introuvable : " + adresse);
        } catch (error) { throw new Error("Impossible de localiser l'adresse."); }
    }

    // Vérification stricte : minimum 6 heures à l'avance
    function verifierDelaiReservation() {
        const dateInput = document.getElementById('date').value;
        const heureInput = document.getElementById('heure').value;

        if (!dateInput || !heureInput) {
            alert("Veuillez sélectionner une date et une heure.");
            return false;
        }

        const dateChoisie = new Date(`${dateInput}T${heureInput}`);
        const dateActuelle = new Date();
        const dateMinAutorisee = new Date(dateActuelle.getTime() + (6 * 60 * 60 * 1000));

        if (dateChoisie < dateMinAutorisee) {
            alert("Les réservations doivent être effectuées au moins 6 heures à l'avance.");
            return false;
        }
        return true;
    }

    // Bouton "Réserver"
    async function reserver() {
        if (!verifierDelaiReservation()) return;

        const gamme = document.getElementById('gamme').value;
        const loader = document.getElementById('loader');
        
        const dateVal = document.getElementById('date').value;
        const heureVal = document.getElementById('heure').value;
        const dateTimeAffiche = `${dateVal} à ${heureVal}`;

        if (mode === 'mise') {
            const duree = parseInt(document.getElementById('duree').value);
            montantFinal = tarifsMiseADispo[gamme][duree];
            
            remplirRecap(gamme, dateTimeAffiche, `Mise à disposition (${duree}h)`, montantFinal);
            passerEtape2();
            return;
        }

        const departTxt = document.getElementById('depart').value;
        const arriveeTxt = document.getElementById('arrivee').value;
        if (!departTxt || !arriveeTxt) return alert("Veuillez remplir les adresses de départ et d'arrivée.");

        loader.style.display = 'block';
        
        try {
            const coordsBase = await getCoordinates(ADRESSE_BASE);
            const coordsDepart = await getCoordinates(departTxt);
            const coordsArrivee = await getCoordinates(arriveeTxt);

            const urlOSRM = `https://router.project-osrm.org/route/v1/driving/${coordsBase.lon},${coordsBase.lat};${coordsDepart.lon},${coordsDepart.lat};${coordsArrivee.lon},${coordsArrivee.lat};${coordsBase.lon},${coordsBase.lat}?overview=false`;
            
            const reponseRoute = await fetch(urlOSRM);
            if (!reponseRoute.ok) throw new Error("Le serveur de calcul de distance est indisponible.");
            const dataRoute = await reponseRoute.json();
            if (dataRoute.code !== 'Ok') throw new Error("Impossible de calculer l'itinéraire.");

            const legs = dataRoute.routes[0].legs;
            const distApproche = legs[0].distance / 1000;
            const distTrajet = legs[1].distance / 1000;
            const distRetour = legs[2].distance / 1000;

            let priseEnCharge = (gamme === 'confort') ? 5 : 10;
            let tarifApproche = (gamme === 'confort') ? 0.45 : 0.60;
            let tarifTrajet   = (gamme === 'confort') ? 0.98 : 1.00;
            let tarifRetour   = (gamme === 'confort') ? 0.45 : 0.60;

            montantFinal = priseEnCharge + (distApproche * tarifApproche) + (distTrajet * tarifTrajet) + (distRetour * tarifRetour);
            distanceFinaleKm = distTrajet;

            loader.style.display = 'none';
            remplirRecap(gamme, dateTimeAffiche, `${distanceFinaleKm.toFixed(1)} km`, montantFinal);
            passerEtape2();

        } catch (error) {
            loader.style.display = 'none';
            if (error.message.includes("Failed to fetch") || error.message.includes("NetworkError")) {
                alert("Le calcul a été bloqué par votre navigateur. Désactivez votre bloqueur de publicité.");
            } else {
                alert(error.message);
            }
        }
    }

    function remplirRecap(gamme, date, trajet, prix) {
        const gammeMaj = gamme.charAt(0).toUpperCase() + gamme.slice(1); 
        document.getElementById('recap-vehicule').innerText = gammeMaj;
        document.getElementById('recap-datetime').innerText = date;
        document.getElementById('recap-trajet').innerText = trajet;
        document.getElementById('recap-prix').innerText = prix.toFixed(2);
    }

    function passerEtape2() {
        document.getElementById('step-1').style.display = 'none';
        document.getElementById('step-2').style.display = 'block';
    }

    function retourStep1() {
        document.getElementById('step-2').style.display = 'none';
        document.getElementById('step-1').style.display = 'block';
    }

    function procederPaiement() {
        const requiredFields = ['client_nom', 'client_email', 'client_tel', 'client_rue', 'client_cp', 'client_ville', 'client_pays'];
        let isValid = true;
        
        requiredFields.forEach(id => {
            if (!document.getElementById(id).value.trim()) {
                isValid = false;
            }
        });

        if (!isValid) {
            alert("Veuillez remplir tous les champs obligatoires (marqués d'une étoile rouge).");
            return;
        }

        alert("Coordonnées validées. Redirection vers Stripe pour un montant de " + montantFinal.toFixed(2) + " €");
    }
</script>

</body>
</html>
